name: Check build configuration

on:
  push:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "Dockerfile.musl"
      - ".dockerignore"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "Dockerfile.musl"
      - ".dockerignore"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check workflows and scripts
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
          shellcheck scripts/build-tdlib.sh
          python3 -m py_compile scripts/verify-tdjson.py
