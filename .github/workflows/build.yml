name: Build TDLib and Release

on:
  workflow_dispatch:
    inputs:
      tdlib:
        description: "TDLib git ref (e.g. v1.8.0 or a commit hash)"
        type: string
        required: true
      mode:
        type: choice
        description: Mode
        required: true
        default: build_publish
        options:
          - build
          - build_publish

permissions:
  contents: read

env:
  CCACHE_MAXSIZE: 1G

jobs:
  prepare-meta:
    name: Resolve TDLib revision and metadata
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit-hash: ${{ steps.meta.outputs.commit-hash }}
      commit-hash-short: ${{ steps.meta.outputs.commit-hash-short }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ inputs.tdlib }}

      - name: Extract metadata
        id: meta
        run: |
          TDLIB_VERSION=$(sed -nE 's/^project\(TDLib VERSION ([0-9.]+) .*/\1/p' CMakeLists.txt)
          test -n "$TDLIB_VERSION"
          TDLIB_COMMIT_HASH=$(git rev-parse HEAD)
          TDLIB_COMMIT_HASH_SHORT=${TDLIB_COMMIT_HASH:0:7}
          {
            echo "version=$TDLIB_VERSION"
            echo "commit-hash=$TDLIB_COMMIT_HASH"
            echo "commit-hash-short=$TDLIB_COMMIT_HASH_SHORT"
          } >> "$GITHUB_OUTPUT"
          printf 'version: %s\ncommit-hash: %s\n' "$TDLIB_VERSION" "$TDLIB_COMMIT_HASH" > meta.yml

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: tdlib-meta
          path: |
            meta.yml
            td/generate/scheme/td_api.tl
          if-no-files-found: error

  build-linux:
    name: Linux glibc (${{ matrix.spec.arch }})
    needs: prepare-meta
    runs-on: ${{ matrix.spec.os }}
    env:
      CC: clang-14
      CXX: clang++-14
      TDLIB_LINKER: lld-14
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    strategy:
      fail-fast: false
      matrix:
        spec:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ needs.prepare-meta.outputs.commit-hash }}
          path: td

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends gperf php-cli ninja-build ccache clang-14 llvm-14 lld-14 libssl-dev zlib1g-dev
          cmake --version

      - name: Cache compiler output
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            build/lto-cache
          key: ccache-${{ matrix.spec.os }}-${{ matrix.spec.arch }}-clang14-${{ hashFiles('scripts/build-tdlib.sh') }}-${{ needs.prepare-meta.outputs.commit-hash }}
          restore-keys: |
            ccache-${{ matrix.spec.os }}-${{ matrix.spec.arch }}-clang14-${{ hashFiles('scripts/build-tdlib.sh') }}-

      - name: Build TDLib
        run: |
          bash scripts/build-tdlib.sh td build
          strip build/libtdjson.so

      - name: Verify build
        run: |
          ldd build/libtdjson.so
          if readelf -d build/libtdjson.so | grep -E 'NEEDED.*lib(ssl|crypto|z)\.'; then
            echo 'OpenSSL and zlib must be linked statically.' >&2
            exit 1
          fi
          python3 scripts/verify-tdjson.py build/libtdjson.so \
            --version '${{ needs.prepare-meta.outputs.version }}' \
            --commit '${{ needs.prepare-meta.outputs.commit-hash }}'

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: tdlib-linux-${{ matrix.spec.arch }}-glibc
          path: build/libtdjson.so
          compression-level: 1
          if-no-files-found: error

  build-linux-musl:
    name: Linux musl (${{ matrix.spec.arch }})
    needs: prepare-meta
    runs-on: ${{ matrix.spec.os }}
    strategy:
      fail-fast: false
      matrix:
        spec:
          - os: ubuntu-22.04-arm
            arch: arm64
            platform: linux/arm64
          - os: ubuntu-22.04
            arch: x64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build, verify and export TDLib with musl
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.musl
          platforms: ${{ matrix.spec.platform }}
          build-args: GIT_REF=${{ needs.prepare-meta.outputs.commit-hash }}
          outputs: type=local,dest=./result
          cache-from: type=gha,scope=musl-${{ matrix.spec.arch }}
          cache-to: type=gha,mode=max,scope=musl-${{ matrix.spec.arch }}

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: tdlib-linux-${{ matrix.spec.arch }}-musl
          path: result/libtdjson.so
          compression-level: 1
          if-no-files-found: error

  build-macos:
    name: macOS (${{ matrix.spec.arch }})
    needs: prepare-meta
    runs-on: ${{ matrix.spec.os }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    strategy:
      fail-fast: false
      matrix:
        spec:
          - os: macos-15-intel
            arch: x64
          - os: macos-14
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ needs.prepare-meta.outputs.commit-hash }}
          path: td

      - name: Install dependencies
        run: brew install gperf openssl@3 zlib php ninja ccache

      - name: Cache compiler output
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.spec.os }}-${{ matrix.spec.arch }}-${{ hashFiles('scripts/build-tdlib.sh') }}-${{ needs.prepare-meta.outputs.commit-hash }}
          restore-keys: |
            ccache-${{ matrix.spec.os }}-${{ matrix.spec.arch }}-${{ hashFiles('scripts/build-tdlib.sh') }}-

      - name: Build TDLib
        run: |
          bash scripts/build-tdlib.sh td build \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DZLIB_INCLUDE_DIR="$(brew --prefix zlib)/include" \
            -DZLIB_LIBRARY="$(brew --prefix zlib)/lib/libz.a"

      - name: Verify build
        run: |
          otool -L build/libtdjson.dylib
          if otool -L build/libtdjson.dylib | grep -E 'lib(ssl|crypto|z)[.0-9]*\.dylib'; then
            echo 'OpenSSL and zlib must be linked statically.' >&2
            exit 1
          fi
          python3 scripts/verify-tdjson.py build/libtdjson.dylib \
            --version '${{ needs.prepare-meta.outputs.version }}' \
            --commit '${{ needs.prepare-meta.outputs.commit-hash }}'

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: tdlib-macos-${{ matrix.spec.arch }}
          path: build/libtdjson.dylib
          compression-level: 1
          if-no-files-found: error

  build-macos-universal:
    name: Create universal macOS library
    needs: build-macos
    runs-on: macos-15-intel
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tdlib-macos-*

      - name: Create universal binary
        run: |
          mkdir -p universal
          lipo tdlib-macos-x64/libtdjson.dylib tdlib-macos-arm64/libtdjson.dylib \
            -output universal/libtdjson.dylib -create
          lipo universal/libtdjson.dylib -verify_arch x86_64 arm64
          otool -L universal/libtdjson.dylib

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: tdlib-macos-universal
          path: universal/libtdjson.dylib
          compression-level: 1
          if-no-files-found: error

  build-windows:
    name: Windows (${{ matrix.build.arch }})
    needs: prepare-meta
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    strategy:
      fail-fast: false
      matrix:
        build:
          - arch: x86
            vcpkg_triplet: x86-windows-static
          - arch: x64
            vcpkg_triplet: x64-windows-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ needs.prepare-meta.outputs.commit-hash }}
          path: td

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.build.arch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.build.arch }}

      - name: Identify dependency toolchain
        id: vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $revision = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-windows-2022-${{ matrix.build.vcpkg_triplet }}-${{ steps.vcpkg.outputs.revision }}-openssl-zlib-gperf-v1
          restore-keys: |
            vcpkg-windows-2022-${{ matrix.build.vcpkg_triplet }}-

      - name: Install dependencies
        shell: pwsh
        run: |
          vcpkg install gperf:x64-windows openssl:${{ matrix.build.vcpkg_triplet }} zlib:${{ matrix.build.vcpkg_triplet }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build TDLib
        shell: pwsh
        run: |
          $jobs = [Math]::Max(1, [Math]::Min([int]$env:NUMBER_OF_PROCESSORS, [int][Math]::Floor(((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB - 2) / 1.5)))
          cmake -S td -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.build.vcpkg_triplet }} `
            "-DGPERF_EXECUTABLE=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/tools/gperf/gperf.exe" `
            -DOPENSSL_USE_STATIC_LIBS=TRUE -DZLIB_USE_STATIC_LIBS=TRUE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --target tdjson --parallel $jobs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify build
        shell: pwsh
        run: |
          python scripts/verify-tdjson.py build/tdjson.dll `
            --version '${{ needs.prepare-meta.outputs.version }}' `
            --commit '${{ needs.prepare-meta.outputs.commit-hash }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: tdlib-windows-${{ matrix.build.arch }}
          path: build/tdjson.dll
          compression-level: 1
          if-no-files-found: error

  organize-build-artifacts:
    name: Organize build artifacts
    runs-on: ubuntu-22.04
    needs:
      - prepare-meta
      - build-linux
      - build-linux-musl
      - build-macos
      - build-macos-universal
      - build-windows

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tdlib-*
          path: artifacts

      - name: Organize build files
        run: |
          mkdir -p build-release

          # Linux binaries
          cp artifacts/tdlib-linux-x64-glibc/libtdjson.so build-release/libtdjson-x64-glibc.so
          cp artifacts/tdlib-linux-arm64-glibc/libtdjson.so build-release/libtdjson-arm64-glibc.so
          cp artifacts/tdlib-linux-x64-musl/libtdjson.so build-release/libtdjson-x64-musl.so
          cp artifacts/tdlib-linux-arm64-musl/libtdjson.so build-release/libtdjson-arm64-musl.so

          # macOS binaries (individual + universal)
          cp artifacts/tdlib-macos-x64/libtdjson.dylib build-release/libtdjson-x64.dylib
          cp artifacts/tdlib-macos-arm64/libtdjson.dylib build-release/libtdjson-arm64.dylib
          cp artifacts/tdlib-macos-universal/libtdjson.dylib build-release/libtdjson-universal.dylib

          # Windows binaries
          cp artifacts/tdlib-windows-x86/tdjson.dll build-release/tdjson-x32.dll
          cp artifacts/tdlib-windows-x64/tdjson.dll build-release/tdjson-x64.dll

          # Metadata
          cp artifacts/tdlib-meta/meta.yml build-release/
          cp artifacts/tdlib-meta/td/generate/scheme/td_api.tl build-release/

      - uses: actions/upload-artifact@v4
        with:
          name: tdlib-release
          path: build-release/*
          compression-level: 1
          if-no-files-found: error

  publish-release:
    if: inputs.mode == 'build_publish'
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs:
      - prepare-meta
      - organize-build-artifacts
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: tdlib-release
          path: release

      - name: Update meta.yml in repository
        run: |
          cp release/meta.yml ./meta.yml
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ./meta.yml
          if ! git diff --staged --quiet; then
            git commit -m "Update TDLib to ${{ needs.prepare-meta.outputs.commit-hash }}"
            git push
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          tag_name: "0.${{ needs.prepare-meta.outputs.version }}-${{ needs.prepare-meta.outputs.commit-hash-short }}"
          name: "TDLib ${{ needs.prepare-meta.outputs.version }} (${{ needs.prepare-meta.outputs.commit-hash-short }})"
          body: |
            ## TDLib Build ${{ needs.prepare-meta.outputs.version }}

            Built from TDLib commit [`${{ needs.prepare-meta.outputs.commit-hash-short }}`](https://github.com/tdlib/td/tree/${{ needs.prepare-meta.outputs.commit-hash }})

            ### Included Binaries:
            - **Linux (glibc)**: `libtdjson-x64-glibc.so`, `libtdjson-arm64-glibc.so`
            - **Linux (musl)**: `libtdjson-x64-musl.so`, `libtdjson-arm64-musl.so`
            - **macOS**: `libtdjson-x64.dylib`, `libtdjson-arm64.dylib`, `libtdjson-universal.dylib`
            - **Windows**: `tdjson-x32.dll`, `tdjson-x64.dll`
            - **Schema**: `td_api.tl`
            - **Metadata**: `meta.yml`
          files: release/*
          token: ${{ secrets.GITHUB_TOKEN }}
